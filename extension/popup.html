<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body><h1>Fanzy Reach</h1><p>在已登录平台的浏览器中配对。扩展会在本浏览器的新标签页执行桌面端选择的发布任务。</p>
<label for="pairing">桌面设置页的配对信息</label><textarea id="pairing" rows="5" spellcheck="false" placeholder='粘贴配对信息'></textarea>
<button id="connect">配对并连接</button><button id="disconnect">断开连接</button>
<p id="status" role="status">正在读取状态…</p><p class="muted">发布时保持浏览器打开。配对仅在当前桌面应用会话有效。登录过期或验证挑战仍需手动处理。</p>
<script src="popup.js"></script></body></html>
