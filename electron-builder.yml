appId: com.ifanzy.reachstudio
productName: Fanzy Reach Studio
artifactName: Fanzy-Reach-Studio-${version}-${arch}.${ext}
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: python
    to: python
    filter:
      - "*.py"
      - "requirements.txt"
asarUnpack:
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"
npmRebuild: true
buildDependenciesFromSource: false
win:
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Fanzy Reach Studio
  deleteAppDataOnUninstall: false
